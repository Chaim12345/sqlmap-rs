[package]
name = "sqlmap-http"
description = "HTTP request engine and page-comparison logic (port of sqlmap lib/request + lib/core/comparison)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sqlmap-tamper = { path = "../sqlmap-tamper" }
sqlmap-core = { path = "../sqlmap-core" }
ureq = { version = "2", features = ["cookies", "gzip", "socks-proxy"] }
url = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
